spring:
  application:
    name: biblioteca-virtual

  #Configuração do PostgreSQL(Conectando-se ao Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_db
    username: dbadmin
    password: p@ssw0rd!@#
    driver-class-name: org.postgresql.Driver

  #Configuração do Hibernate/JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #Configuração do Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true

  #Configuraçãoo de Erros
  web:
    error:
      include-stacktrace: never
      include-message: always
      include-exception: false

#Configuraão da porta do servidor
server:
  port: 8080